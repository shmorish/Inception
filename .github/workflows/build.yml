name: Container
on: push

jobs:
  run-Inception:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Create .env
        run: |
          make envs
      - name: Deploy
        run: |
          docker compose -f srcs/docker-compose.yml build
          docker compose -f srcs/docker-compose.yml up