version: "3.8"

services:
  nginx:
    build: requirements/nginx/
    container_name: nginx
    depends_on:
      - wordpress
      - mariadb
      - adminer
    ports:
      - "80:80"
    volumes:
      - ~/data/web:/var/www/html
      # - ./web:/var/www/html
    networks:
      inception:

  wordpress:
    build: requirements/wordpress/
    container_name: wordpress
    depends_on:
      - mariadb
    volumes:
      - ~/data/web:/var/www/html
      # - ./web:/var/www/html
    networks:
      inception:
    environment:
      - DB_NAME=$DB_NAME
      - DB_USER=$DB_USER
      - DB_PASSWORD=$DB_PASSWORD
      - DB_HOST=$DB_HOST
      - WP_URL=$WP_URL
      - WP_TITLE=$WP_TITLE
      - WP_ADMIN=$WP_ADMIN
      - WP_ADMIN_PASS=$WP_ADMIN_PASS
      - WP_ADMIN_EMAIL=$WP_ADMIN_EMAIL
      - WP_EDITOR_USER=$WP_EDITOR_USER
      - WP_EDITOR_PASS=$WP_EDITOR_PASS
      - WP_EDITOR_EMAIL=$WP_EDITOR_EMAIL

  mariadb:
    build: requirements/mariadb/
    container_name: mariadb
    volumes:
      - ~/data/db:/var/lib/mysql
      # - ./db:/var/lib/mysql
    networks:
      inception:
    environment:
      - DB_NAME=$DB_NAME
      - DB_USER=$DB_USER
      - DB_PASSWORD=$DB_PASSWORD

  adminer:
    build: requirements/bonus/adminer/
    container_name: adminer
    depends_on:
      - mariadb
    networks:
      - inception

networks:
  inception:
    driver: bridge